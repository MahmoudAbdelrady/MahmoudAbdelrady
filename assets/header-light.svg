<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Mahmoud Abdelrady, full-stack software engineer in Cairo">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .card { opacity: 0; animation: rise .5s ease-out forwards; }
    .pulse { animation: flow 2.6s cubic-bezier(.45,0,.55,1) 1s infinite; opacity: 0; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes flow {
      0% { transform: translateY(0); opacity: 0; }
      12% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(164.0px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; opacity: 1; }
      .pulse { animation: none; opacity: 0; }
    }
  </style>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#eef1f4"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="50%" r="45%">
      <stop offset="0" stop-color="#0969da" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#0969da" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" rx="14" fill="#ffffff"/>
  <rect width="1200" height="320" rx="14" fill="url(#dots)"/>
  <rect width="1200" height="320" rx="14" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="14" fill="none" stroke="#d0d7de"/>

  <text class="sans" x="64" y="104" font-size="13" font-weight="600" letter-spacing="2.4" fill="#9a6700">HI, I'M</text>
  <text class="sans" x="62" y="160" font-size="48" font-weight="700" fill="#1f2328" letter-spacing="-0.5">Mahmoud Abdelrady</text>
  <text class="sans" x="64" y="200" font-size="21" fill="#1f2328">Full-stack software engineer</text>
  <text class="sans" x="64" y="236" font-size="15" fill="#59636e">Cairo, Egypt</text>

  <line x1="684" y1="78.0" x2="684" y2="242.0" stroke="#d0d7de" stroke-width="2"/>
  <line x1="684" y1="78.0" x2="712" y2="78.0" stroke="#d0d7de" stroke-dasharray="3 4"/><circle cx="684" cy="78.0" r="5" fill="#ffffff" stroke="#0969da" stroke-width="2"/><line x1="684" y1="160.0" x2="712" y2="160.0" stroke="#d0d7de" stroke-dasharray="3 4"/><circle cx="684" cy="160.0" r="5" fill="#ffffff" stroke="#9a6700" stroke-width="2"/><line x1="684" y1="242.0" x2="712" y2="242.0" stroke="#d0d7de" stroke-dasharray="3 4"/><circle cx="684" cy="242.0" r="5" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/>
  <circle class="pulse" cx="684" cy="78.0" r="4" fill="#9a6700"/>
  
  <g class="card" style="animation-delay:0.20s">
    <rect x="712" y="46" width="428" height="64" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <rect x="712" y="60" width="3" height="36" rx="1.5" fill="#0969da"/>
    <text class="sans" x="736" y="72" font-size="11.5" font-weight="600" letter-spacing="1.6" fill="#0969da">FRONTEND</text>
    <text class="sans" x="736" y="95" font-size="17" fill="#1f2328">Angular  ·  React  ·  TypeScript</text>
  </g>
  <g class="card" style="animation-delay:0.45s">
    <rect x="712" y="128" width="428" height="64" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <rect x="712" y="142" width="3" height="36" rx="1.5" fill="#9a6700"/>
    <text class="sans" x="736" y="154" font-size="11.5" font-weight="600" letter-spacing="1.6" fill="#9a6700">BACKEND</text>
    <text class="sans" x="736" y="177" font-size="17" fill="#1f2328">Spring Boot  ·  Java  ·  Kotlin</text>
  </g>
  <g class="card" style="animation-delay:0.70s">
    <rect x="712" y="210" width="428" height="64" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <rect x="712" y="224" width="3" height="36" rx="1.5" fill="#1a7f37"/>
    <text class="sans" x="736" y="236" font-size="11.5" font-weight="600" letter-spacing="1.6" fill="#1a7f37">DATA &amp; INFRA</text>
    <text class="sans" x="736" y="259" font-size="17" fill="#1f2328">PostgreSQL  ·  RabbitMQ  ·  Docker  ·  Kubernetes</text>
  </g>
</svg>
